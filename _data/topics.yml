# 주제(Topic) 분류
#
# 홈 화면의 주제 필터, 카드의 주제 표시, TOPICS 탭(타임라인·목차), 포스트 상단 주제 표시에 사용됩니다.
# 기존 글은 아래 `posts` 목록(파일명에서 날짜를 뺀 slug)으로 연결합니다.
# 새 글은 front matter에 `topic: <id>` 한 줄만 넣어도 됩니다. (예: topic: safety)
#
# 필드
#   id     : 고유 키 (URL 앵커로도 사용: /topics/#<id>)
#   name   : 화면에 보이는 이름
#   desc   : 주제 설명 한 줄
#   posts  : 이 주제에 속하는 기존 글 slug 목록

